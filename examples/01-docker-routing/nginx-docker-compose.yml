services:
  nginx:
    image: "nginx:latest"
    container_name: "nginx"
    hostname: "nginx"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.entrypoints=web"
      - "traefik.http.routers.nginx.rule=Host(`nginx.$MY_DOMAIN`)"

networks:
  default:
    name: 
    external: true
