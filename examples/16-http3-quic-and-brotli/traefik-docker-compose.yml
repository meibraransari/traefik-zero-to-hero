version: "3.7"

services:
  traefik:
    image: "traefik:v3.0"
    container_name: "traefik"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"   # Essential for HTTP/3 QUIC!
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/traefik.yml:ro"
      - "./dynamic_conf:/dynamic_conf:ro"
      - "./acme.json:/acme.json"

networks:
  default:
    external:
      name: $DEFAULT_NETWORK
