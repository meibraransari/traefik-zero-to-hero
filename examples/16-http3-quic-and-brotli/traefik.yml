## STATIC CONFIGURATION WITH HTTP/3 ENABLED
log:
  level: INFO

experimental:
  v3: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    http3:
      advertisedPort: 443

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik_net
  file:
    directory: "/dynamic_conf"
    watch: true

certificatesResolvers:
  lets-encr:
    acme:
      email: your-email@example.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web
