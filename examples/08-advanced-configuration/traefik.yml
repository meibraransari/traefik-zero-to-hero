## STATIC CONFIGURATION WITH FILE PROVIDER FOR ADVANCED DYNAMIC CONFIG
log:
  level: INFO

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100

api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik_net
  file:
    directory: "/dynamic_conf"
    watch: true

certificatesResolvers:
  lets-encr:
    acme:
      email: your-email@example.com
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
