## AUTHELIA CONFIGURATION SKELETON
jwt_secret: a_very_secure_jwt_secret_key_change_me
default_redirection_url: https://auth.example.com

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: "whoami.example.com"
      policy: two_factor

session:
  name: authelia_session
  domain: example.com
  secret: another_very_secure_session_secret
  expiration: 3600
